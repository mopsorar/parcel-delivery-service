name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LOG_LEVEL: INFO
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: parcel_delivery_test
      DB_USER: parcel_delivery_test
      # Disposable CI credentials, not production secrets.
      DB_PASSWORD: ci-test-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      EXCHANGE_RATE_CACHE_TTL_SECONDS: "3600"
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: parcel_delivery_test
          POSTGRES_USER: parcel_delivery_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U parcel_delivery_test -d parcel_delivery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.8"
          python-version: "3.13.16"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Apply and check migrations
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
      - name: Run all tests
        run: uv run --locked pytest
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format check
        run: uv run --locked ruff format --check .

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_NAME: parcel_delivery_smoke
      DB_USER: parcel_delivery_smoke
      DB_PASSWORD: ci-smoke-only-password
      APP_PORT: "8000"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker compose build
      - name: Start Compose and wait for healthy services
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Verify running application and runtime image
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/docs > /dev/null
          docker compose exec -T app alembic check
          docker compose exec -T app python -c 'import os, importlib.util; assert os.getuid() != 0; assert not os.path.exists("/app/.env"); assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "pre_commit"))'
      - name: Smoke test parcel API without external network
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          client = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
          )
          with client.open(f"{base_url}/parcel-types", timeout=5) as response:
              parcel_types = json.load(response)
          assert {item["name"] for item in parcel_types} == {"clothes", "electronics", "misc"}
          payload = json.dumps({
              "name": "CI smoke parcel",
              "weight": "1.250",
              "type_id": parcel_types[0]["id"],
              "content_value_usd": "100.00",
          }).encode()
          request = urllib.request.Request(
              f"{base_url}/parcels", data=payload,
              headers={"Content-Type": "application/json", "X-Request-ID": "ci-smoke"},
          )
          with client.open(request, timeout=5) as response:
              assert response.status == 201
              assert response.headers["X-Request-ID"] == "ci-smoke"
              parcel_id = json.load(response)["id"]
          with client.open(f"{base_url}/parcels", timeout=5) as response:
              parcels = json.load(response)
          assert [parcel["id"] for parcel in parcels] == [parcel_id]
          assert parcels[0]["delivery_cost_rub"] is None
          assert parcels[0]["delivery_cost_display"] == "Не рассчитано"
          assert parcels[0]["transport_company_id"] is None
          assignment = urllib.request.Request(
              f"{base_url}/parcels/{parcel_id}/transport-company",
              data=json.dumps({"company_id": 321}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with client.open(assignment, timeout=5) as response:
              assert response.status == 200
              assert json.load(response) == {
                  "parcel_id": parcel_id, "transport_company_id": 321,
              }
          with client.open(f"{base_url}/parcels/{parcel_id}", timeout=5) as response:
              parcel = json.load(response)
              assert parcel["id"] == parcel_id
              assert parcel["transport_company_id"] == 321
          PY
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color app migrate postgres redis
      - name: Stop disposable CI services
        if: always()
        run: docker compose down --volumes --remove-orphans
